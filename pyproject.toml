[project]
name = "task-runner-sdlc"
version = "0.2.0"
description = "Lean file organization CLI: organize, dedupe, index, summarize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
task-runner = "task_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]